# Google Cloud Build CI/CD Pipeline
# Executes linting, static typing, unit/integration/chaos tests, evaluation
# regression gate, container image build, and zero-downtime blue/green Cloud Run deployment.

steps:
  # Step 1: Install Python Dependencies
  - id: "install-dependencies"
    name: "python:3.11-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install --upgrade pip
        pip install -e ".[dev]"

  # Step 2: Static Analysis & Linting (Ruff & Mypy)
  - id: "lint-and-typecheck"
    name: "python:3.11-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install -e ".[dev]"
        ruff check src/ tests/ eval/
        mypy src/

  # Step 3: Unit, Integration & Chaos Test Suite (>= 80% Coverage Gate)
  - id: "pytest-coverage-gate"
    name: "python:3.11-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install -e ".[dev]"
        pytest --cov=src --cov-fail-under=80

  # Step 4: Golden Dataset Evaluation Regression Gate
  - id: "eval-regression-gate"
    name: "python:3.11-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install -e ".[dev]"
        python -m eval.regression_gate

  # Step 5: Build & Tag Security-Hardened Container Image
  - id: "build-container-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ira-agent:${COMMIT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ira-agent:latest"
      - "."

  # Step 6: Push Image to Google Artifact Registry
  - id: "push-container-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ira-agent"

  # Step 7: Stage New Cloud Run Revision with Zero Traffic (Blue/Green Canary Stage)
  - id: "stage-revision-no-traffic"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ira-agent:${COMMIT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--revision-suffix=${SHORT_SHA}"
      - "--no-traffic"
      - "--tag=candidate-${SHORT_SHA}"

  # Step 8: Smoke-Test Staged Revision Directly via Candidate Tag URL
  - id: "smoke-test-candidate-revision"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-euo"
      - "pipefail"
      - "-c"
      - |
        CANDIDATE_URL=$$(gcloud run services describe "${_SERVICE_NAME}" \
          --region="${_REGION}" \
          --format="value(status.traffic. flattened().filter(tag:candidate-${SHORT_SHA}).url)" | head -n1)
        if [ -z "$${CANDIDATE_URL}" ]; then
          echo "ERROR: could not resolve URL for tag candidate-${SHORT_SHA}" >&2
          exit 1
        fi
        echo "Probing staged revision at $${CANDIDATE_URL}..."
        TOKEN=$$(gcloud auth print-identity-token --audiences="$${CANDIDATE_URL}")

        for i in 1 2 3 4 5; do
          if curl -fsS --max-time 10 -H "Authorization: Bearer $${TOKEN}" "$${CANDIDATE_URL}/readyz" | grep -q '"status":"READY"'; then
            echo "Readiness probe passed on attempt $${i}."
            break
          fi
          if [ "$${i}" -eq 5 ]; then
            echo "ERROR: candidate-${SHORT_SHA} failed /readyz after 5 attempts. Leaving 100% traffic on current revision." >&2
            exit 1
          fi
          sleep 3
        done

        curl -fsS --max-time 30 \
          -H "Authorization: Bearer $${TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{"ticker":"AAPL","fiscal_year":2024,"focus_areas":["Operating_Margin"],"include_macro_context":false}' \
          "$${CANDIDATE_URL}/v1/research/equity" | grep -q '"ticker":"AAPL"'
        echo "End-to-end smoke test passed."

  # Step 9: Cut 100% Traffic Over to Verified Revision
  - id: "promote-candidate-to-full-traffic"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "services"
      - "update-traffic"
      - "${_SERVICE_NAME}"
      - "--region=${_REGION}"
      - "--to-revisions=${_SERVICE_NAME}-${SHORT_SHA}=100"

substitutions:
  _REGION: "us-central1"
  _ARTIFACT_REPO: "ira-repo"
  _SERVICE_NAME: "ira-service-production"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"
