# Google Cloud Build pipeline for the IRA Streamlit Console
substitutions:
  _REGION: us-central1
  _REPOSITORY: ira-repo
  _IMAGE: ira-ui
  _TAG: latest
  _COMMIT_SHA: manual

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_TAG}"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile.ui
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_TAG}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${_COMMIT_SHA}
      - .

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
