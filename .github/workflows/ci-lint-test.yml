name: CI - Lint, Type-Check & Automated Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with Ruff (Optional Advisory)
        run: ruff check src/ tests/
        continue-on-error: true

      - name: Static Type Check with MyPy (Optional Advisory)
        run: mypy src/ --ignore-missing-imports
        continue-on-error: true

      - name: Run Pytest Suite with Coverage (>=80%)
        run: |
          pytest --cov=src --cov-fail-under=80 --cov-report=term-missing -v
