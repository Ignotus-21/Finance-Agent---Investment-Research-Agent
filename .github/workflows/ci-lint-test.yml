name: CI - Lint, Type-Check & Automated Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Least privilege for GITHUB_TOKEN. Every job here only reads the
# repository; the default grant is far wider than that.
permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # These were previously `continue-on-error: true`, which meant a lint or
      # type error could land on main behind a green check mark. The same two
      # checks now run in pre-commit, so nothing reaches CI that has not
      # already passed locally - there is no reason to keep them advisory.
      - name: Lint with Ruff
        run: ruff check src/ tests/ scripts/ eval/

      - name: Static Type Check with MyPy
        run: mypy src/ --ignore-missing-imports

      - name: Run Pytest Suite with Coverage (>=80%)
        run: |
          pytest --cov=src --cov-fail-under=80 --cov-report=term-missing -v
