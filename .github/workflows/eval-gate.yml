name: CI - Evaluation Regression Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Least privilege for GITHUB_TOKEN. Every job here only reads the
# repository; the default grant is far wider than that.
permissions:
  contents: read

jobs:
  evaluation-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Execute Golden Evaluation Regression Gate
        env:
          PYTHONPATH: .
        run: |
          python -m eval.regression_gate
